<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <h1 class="h1">MAKEUP store</h1>
        <div class="container">
           
        <div class="shop-area">

            <div class="">
                <input type="text" class="i-name" placeholder="name">
                 <input type="text" class="i-price" placeholder="price">
                  <input type="text" class="i-img" placeholder="picture">
            </div>

            <div>
                <button class="b-add">add product</button>
                <button class="b-remove">remove product</button>
            </div>

             <ul class="out-1"></ul>
        </div>
       
        <div class="cart-area">
            <div>
                <h3>cart 🛒</h3>
                <ul class="out-2"></ul>
                
            </div>
            <div>
                    <span class="total">0</span>
                    <span class="cart-send"></span>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
